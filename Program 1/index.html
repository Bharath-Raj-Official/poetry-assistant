<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhyme Finder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 50;
            margin: 0;
        }
        label {
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .output {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <small>Name: Bharath Raj Rajamohan</small>
    <br>
    <small>UOL Student ID: [removed student identifier] </small>
    <br>
    <small>SIM  Student ID: [removed student identifier]</small>
    <div class="container">
        <h2>Rhyme Finder</h2>
        <label for="wordInput">Enter a word:</label>
        <input type="text" id="wordInput" placeholder="Enter your word...">
        <button id="findRhymesButton">Search</button>
        <div class="output" id="outputBox"></div>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="program-1.js"></script>
</body>
</html>
